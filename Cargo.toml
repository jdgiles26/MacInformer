[workspace]
resolver = "2"
members = ["crates/macinformer-core", "crates/macinformer-tui", "crates/macinformer-menubar"]

[package]
name = "macinformer"
version = "0.1.0"
edition = "2021"
description = "System Informer's feature set, ported natively to macOS (Apple Silicon) in Rust"
license = "MIT"

[dependencies]
macinformer-core = { path = "crates/macinformer-core" }
macinformer-tui = { path = "crates/macinformer-tui" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
